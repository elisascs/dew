<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style_js.css">
  <title>Calculadora de Média</title>
</head>
<body>

<header>
    <div class="banner">
        <h1 class="tituloprincipal">Calculadora de Média Acadêmica</h1>
    </div>
</header>
  <form id="formularioaAcademico">
    <h2>Formulário</h2>

    <div>
    <label for="nome">Digite seu nome:</label>
      <input type="text" 
      id="nome" 
      name="nome" 
      placeholder="Digite seu nome" 
      required >
      <button type="button" id="btnAvancar">Avançar</button>
    </div>

    <div id="blocoNotas" style="display: none;">
      <label for="nota1">Digite a primeira nota:</label>
      <input type="number" 
      id="nota1" name="nota1" 
      placeholder="Digite a primeira nota" 
      max="10"
      min="0"
      step="0.5"
      required />

      <br><br>

      <label for="nota2">Digite a segunda nota:</label>
      <input type="number" 
      id="nota2" 
      name="nota2" 
      placeholder="Digite a segunda nota" 
      max="10"
      min="0"
      step="0.5"
      required />

      <button type="button" id="calcular">Calcular Média</button>
    </div>

  </form>

  <script src="form.js"></script>
</body>
</html>
